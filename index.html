<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="This is simple product preview card product"
    />
    <meta name="author" content="Christ0ph3R3Q" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style/reset.css" />
    <link rel="stylesheet" href="./style/colors.css" />
    <link rel="stylesheet" href="./style/index.css" />
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="card">
      <picture class="card__media">
        <source
          media="(min-width: 1200px)"
          srcset="./images/image-product-desktop.jpg"
        />
        <img
          src="./images/image-product-mobile.jpg"
          class="card__image"
          alt="Gabrielle Essence Eau De Parfum"
        />
      </picture>
      <section class="card__wrapper">
        <article class="card__content">
          <span class="card__category">Perfume</span>
          <h3 class="card__title">Gabrielle Essence Eau De Parfum</h3>
          <p>
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div>
            <p>$149.99</p>
            <p>$169.99</p>
          </div>
          <button type="button">Add to Cart</button>
        </article>
      </section>
    </main>

      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here Christ0ph3R3Q</a>.
    </footer> -->
  </body>
</html>
