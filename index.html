<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="This is simple product preview card product"
    />
    <meta name="author" content="Christ0ph3R3Q" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style/reset.css" />
    <link rel="stylesheet" href="./style/colors.css" />
    <link rel="stylesheet" href="./style/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="card">
      <picture class="card__media">
        <source
          media="(min-width: 768px)"
          srcset="./images/image-product-desktop.jpg"
        />
        <img
          src="./images/image-product-mobile.jpg"
          class="card__image"
          alt="Gabrielle Essence Eau De Parfum"
        />
      </picture>
      <article class="card__wrapper">
        <div class="card__content">
          <span class="card__category">Perfume</span>
          <h3 class="card__title">Gabrielle Essence Eau De Parfum</h3>
          <p class="card__description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="card__price">
            <p class="card__price--cut">$149.99</p>
            <s class="card__price--regural">$169.99</s>
          </div>
          <button type="button" class="card__btn">
            <img
              src="./images/icon-cart.svg"
              alt=""
              class="card__btn--icon"
            />Add to Cart
          </button>
        </div>
      </article>
    </main>

    </footer> -->
  </body>
</html>
